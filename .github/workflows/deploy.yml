name: Deploy to GitHub Pages

# Builds on push to either branch; the deploy job only runs on the repository's
# DEFAULT branch, because GitHub's auto-created `github-pages` environment only
# permits deployments from the default branch (deploys from any other branch are
# rejected outright). The default branch is currently
# `claude/3d-to-step-converter-7borlp`; once `main` is made the default (Settings
# -> Branches) it will deploy from `main` with no other change, and pushes to the
# non-default branch stay green (build only, deploy skipped).
on:
  push:
    branches: [main, claude/3d-to-step-converter-7borlp]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Grouped PER BRANCH, not globally. A single `pages` group looks right — one
# deploy stream — but only the default branch's run reaches the deploy job, so a
# push to the other branch was cancelling the only run that could actually
# publish. Pushing both branches for the same commit (branch first, then main)
# therefore deployed nothing at all, while both runs reported green: the killed
# one as "cancelled", the survivor as a build whose deploy step was skipped.
#
# Per-ref grouping keeps the property that matters — a newer push to a branch
# supersedes its own in-flight build — without one branch interfering with the
# other. Only one branch can deploy, so this cannot produce concurrent deploys.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          # Matches the GitHub Pages project URL ( /<repo>/ ); change here if
          # the repository is ever renamed or the deploy target moves.
          VITE_BASE: /stepper/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          # Auto-enable Pages (Actions source) so no manual repo-settings step
          # is needed on first deploy. Idempotent if already enabled.
          enablement: true

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    # Only the default branch can deploy to the github-pages environment; other
    # branches build and stop here (green), rather than failing on a rejected deploy.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
