[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meshfix"
version = "0.1.0"
description = "Deterministic mesh repair for 3D printing, with quantified fidelity loss"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2,<3",
    "trimesh>=4.5,<5",
    "typer>=0.12,<1",
]

# PyMeshLab, pyopenvdb, blender, aw3 and FloatTetwild_bin are SOFT dependencies
# detected at runtime (SPEC 12). The core must work without them.
[project.optional-dependencies]
poisson = ["pymeshlab>=2023.12,<2024"]
fast-rays = ["embreex>=2.17"]
# scipy is a TEST dependency only: tests/test_nputil.py checks the numpy
# replacements against it. Shipping it would double the Pyodide payload.
dev = ["pytest>=8,<9", "pytest-cov>=5", "rtree>=1.2", "manifold3d>=2.5", "scipy>=1.11,<2"]

[project.scripts]
meshfix = "meshfix.cli:main"

[tool.setuptools.packages.find]
include = ["meshfix*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
